<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Workstream Tree</title>
<meta name="description" content="Cross-project timeline of Tiger's Velero/OADP/KubeVirt Data Mover/CNCF work — status, idle time, and blockers at a glance.">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="topbar">
  <h1>Workstream Tree</h1>
  <span class="freshness" id="freshness">Loading data…</span>
  <span class="server-state" id="server-state" data-online="false">local server: checking…</span>
  <button id="publish-btn" disabled>Save &amp; Publish</button>
  <div class="legend" id="legend"></div>
</div>

<div class="timeline-scroll">
  <div class="lanes-header" id="lanes-header"></div>
  <div class="timeline" id="timeline"></div>
</div>

<div class="panel" id="panel">
  <button class="panel-close" id="panel-close" aria-label="Close">✕</button>
  <h2 id="panel-title"></h2>
  <div id="panel-meta" style="font-size:12px;color:var(--text-secondary)"></div>
  <ul class="ci-checks" id="panel-ci"></ul>

  <label for="panel-workstream">Workstream</label>
  <input id="panel-workstream" list="lane-options" autocomplete="off">
  <datalist id="lane-options"></datalist>

  <label for="panel-note">Note</label>
  <textarea id="panel-note" placeholder="Why this matters, what it's blocked on, next step…"></textarea>

  <div class="panel-actions">
    <a id="panel-link" href="#" target="_blank" rel="noopener">Open on GitHub ↗</a>
  </div>
  <div class="panel-actions">
    <button id="panel-apply">Apply</button>
  </div>
</div>

<div id="toast"></div>
<div id="hover-tooltip"></div>

<script src="app.js"></script>
</body>
</html>
