<svg xmlns="http://www.w3.org/2000/svg" width="900" height="330" viewBox="0 0 900 330" role="img" aria-labelledby="t d">
  <title id="t">Languages by merged pull requests</title>
  <desc id="d">Donut and bar chart of merged PRs by repository language; Go leads at 78%.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ee0000"/><stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#ee0000" stop-opacity=".35"/><stop offset="1" stop-color="#ee0000" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="900" height="330" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #8b949e; }
    
    .seg { stroke-dasharray: var(--len) var(--rest); animation: draw .9s cubic-bezier(.3,.7,.2,1) both; }
    @keyframes draw { from { stroke-dasharray: 0 100; } to { stroke-dasharray: var(--len) var(--rest); } }
    .lbar { transform-box: fill-box; transform-origin: left; animation: wipe 1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }</style>
  <rect width="900" height="330" rx="16" fill="url(#card)"/>
  <g clip-path="url(#clip)">

    <text x="32" y="38" font-size="18" font-weight="700">Languages I ship in</text>
    <text class="muted" x="32" y="58" font-size="12">Merged PRs weighted by each repo's primary language · 986 PRs across 102 repos</text>
    <circle cx="215" cy="185" r="98" fill="none" stroke="#21262d" stroke-width="30"/>
    <circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#00ADD8" stroke-width="30" transform="rotate(-90 215 185)" style="--len:77.29;--rest:22.71;stroke-dashoffset:-0.00;animation-delay:0.20s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#89e051" stroke-width="30" transform="rotate(-90 215 185)" style="--len:12.89;--rest:87.11;stroke-dashoffset:-77.99;animation-delay:0.38s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#a52a22" stroke-width="30" transform="rotate(-90 215 185)" style="--len:2.44;--rest:97.56;stroke-dashoffset:-91.58;animation-delay:0.56s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#f1e05a" stroke-width="30" transform="rotate(-90 215 185)" style="--len:0.31;--rest:99.69;stroke-dashoffset:-94.73;animation-delay:0.74s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#3572A5" stroke-width="30" transform="rotate(-90 215 185)" style="--len:0.30;--rest:99.70;stroke-dashoffset:-95.74;animation-delay:0.92s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#A97BFF" stroke-width="30" transform="rotate(-90 215 185)" style="--len:0.30;--rest:99.70;stroke-dashoffset:-96.55;animation-delay:1.10s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="#3178c6" stroke-width="30" transform="rotate(-90 215 185)" style="--len:0.30;--rest:99.70;stroke-dashoffset:-97.26;animation-delay:1.28s"/><circle class="seg" cx="215" cy="185" r="98" pathLength="100" fill="none" stroke="hsl(157,55%,55%)" stroke-width="30" transform="rotate(-90 215 185)" style="--len:1.43;--rest:98.57;stroke-dashoffset:-97.87;animation-delay:1.46s"/>
    <text class="mono" x="215" y="183" font-size="26" font-weight="800" text-anchor="middle">78%</text>
    <text class="muted" x="215" y="205" font-size="13" text-anchor="middle">Go</text>
