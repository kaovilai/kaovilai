t="600">Kotlin</text><text class="mono muted" x="810" y="236" font-size="12" text-anchor="end">0.7%</text><rect x="440" y="243" width="370" height="6" rx="3" fill="#21262d"/><rect class="lbar" x="440" y="243" width="7.4" height="6" rx="3" fill="#A97BFF" style="animation-delay:1.30s"/><circle cx="424" cy="260" r="5" fill="#3178c6"/><text x="440" y="264" font-size="13" font-weight="600">TypeScript</text><text class="mono muted" x="810" y="264" font-size="12" text-anchor="end">0.6%</text><rect x="440" y="271" width="370" height="6" rx="3" fill="#21262d"/><rect class="lbar" x="440" y="271" width="7.4" height="6" rx="3" fill="#3178c6" style="animation-delay:1.48s"/><circle cx="424" cy="288" r="5" fill="hsl(157,55%,55%)"/><text x="440" y="292" font-size="13" font-weight="600">Other</text><text class="mono muted" x="810" y="292" font-size="12" text-anchor="end">2.1%</text><rect x="440" y="299" width="370" height="6" rx="3" fill="#21262d"/><rect class="lbar" x="440" y="299" width="10.1" height="6" rx="3" fill="hsl(157,55%,55%)" style="animation-delay:1.66s"/>
  </g>
  <rect x=".5" y=".5" width="899" height="329" rx="16" fill="none" stroke="#30363d"/>
</svg>
