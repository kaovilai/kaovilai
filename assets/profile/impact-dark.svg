<svg xmlns="http://www.w3.org/2000/svg" width="900" height="310" viewBox="0 0 900 310" role="img" aria-labelledby="t d">
  <title id="t">Merged pull requests per year</title>
  <desc id="d">Bar chart of merged PRs per year, rising to 235 so far in 2026.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ee0000"/><stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#ee0000" stop-opacity=".35"/><stop offset="1" stop-color="#ee0000" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="900" height="310" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #8b949e; }
    
    .bar { transform-box: fill-box; transform-origin: bottom; animation: rise 1s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes rise { from { transform: scaleY(0); } to { transform: scaleY(1); } }
    .now { animation: rise 1s cubic-bezier(.2,.8,.2,1) both, glow 3s ease-in-out 2s infinite; }
    @keyframes glow { 0%,100% { filter: none; } 50% { filter: drop-shadow(0 0 8px rgba(238,0,0,.65)); } }
    .pop { opacity: 0; animation: fade .5s ease-out both; }
    @media (prefers-reduced-motion: reduce) { .pop { opacity: 1; } }
    @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }</style>
  <rect width="900" height="310" rx="16" fill="url(#card)"/>
  <g clip-path="url(#clip)">

    <text x="32" y="38" font-size="18" font-weight="700">Merged PRs per year</text>
    <text class="muted" x="32" y="58" font-size="12">Public repos outside my personal namespace · 1,013 total · *2026 is year-to-date</text>
    <line x1="60" x2="860" y1="252.0" y2="252.0" stroke="#21262d"/><text class="mono muted" x="54" y="256.0" font-size="10" text-anchor="end">0</text><line x1="60" x2="860" y1="195.3" y2="195.3" stroke="#21262d"/><text class="mono muted" x="54" y="199.3" font-size="10" text-anchor="end">100</text><line x1="60" x2="860" y1="138.7" y2="138.7" stroke="#21262d"/><text class="mono muted" x="54" y="142.7" font-size="10" text-anchor="end">200</text><line x1="60" x2="860" y1="82.0" y2="82.0" stroke="#21262d"/><text class="mono muted" x="54" y="86.0" font-size="10" text-anchor="end">300</text>
    <rect class="bar" x="88.8" y="229.9" width="61.2" height="22.1" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.15s"/><text class="mono pop" x="119.4" y="221.9" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:0.65s;">39</text><text class="mono muted" x="119.4" y="272" font-size="11" text-anchor="middle">2019</text><rect class="bar" x="187.5" y="250.0" width="61.2" height="2.0" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.27s"/><text class="mono pop" x="218.1" y="242.0" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:0.77s;">3</text><text class="mono muted" x="218.1" y="272" font-size="11" text-anchor="middle">2020</text><rect class="bar" x="286.3" y="197.0" width="61.2" height="55.0" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.39s"/><text class="mono pop" x="316.9" y="189.0" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:0.89s;">97</text><text class="mono muted" x="316.9" y="272" font-size="11" text-anchor="middle">2021</text><rect class="bar" x="385.0" y="165.3" width="61.2" height="86.7" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.51s"/><text class="mono pop" x="415.6" y="157.3" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.01s;">153</text><text class="mono muted" x="415.6" y="272" font-size="11" text-anchor="middle">2022</text><rect class="bar" x="483.8" y="142.1" width="61.2" height="109.9" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.63s"/><text class="mono pop" x="514.4" y="134.1" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.13s;">194</text><text class="mono muted" x="514.4" y="272" font-size="11" text-anchor="middle">2023</text><rect class="bar" x="582.5" y="168.1" width="61.2" height="83.9" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.75s"/><text class="mono pop" x="613.1" y="160.1" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.25s;">148</text><text class="mono muted" x="613.1" y="272" font-size="11" text-anchor="middle">2024</text><rect class="bar" x="681.3" y="170.4" width="61.2" height="81.6" rx="5" fill="#8b949e" style="opacity:.55;animation-delay:0.87s"/><text class="mono pop" x="711.9" y="162.4" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.37s;">144</text><text class="mono muted" x="711.9" y="272" font-size="11" text-anchor="middle">2025</text><rect class="bar now" x="780.0" y="118.8" width="61.2" height="133.2" rx="5" fill="url(#hot)" style="opacity:1;animation-delay:0.99s"/><text class="mono pop" x="810.6" y="110.8" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.49s;fill:#ff6b6b">235</text><text class="mono muted" x="810.6" y="272" font-size="11" text-anchor="middle">2026*</text>
  </g>
  <rect x=".5" y=".5" width="899" height="309" rx="16" fill="none" stroke="#30363d"/>
</svg>
