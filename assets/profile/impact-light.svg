nchor="middle" style="animation-delay:1.25s;">148</text><text class="mono muted" x="613.1" y="272" font-size="11" text-anchor="middle">2024</text><rect class="bar" x="681.3" y="190.8" width="61.2" height="61.2" rx="5" fill="#59636e" style="opacity:.55;animation-delay:0.87s"/><text class="mono pop" x="711.9" y="182.8" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.37s;">144</text><text class="mono muted" x="711.9" y="272" font-size="11" text-anchor="middle">2025</text><rect class="bar now" x="780.0" y="118.6" width="61.2" height="133.4" rx="5" fill="url(#hot)" style="opacity:1;animation-delay:0.99s"/><text class="mono pop" x="810.6" y="110.6" font-size="12" font-weight="700" text-anchor="middle" style="animation-delay:1.49s;fill:#ee0000">314</text><text class="mono muted" x="810.6" y="272" font-size="11" text-anchor="middle">2026*</text>
    <path class="trend" d="M119.4,235.4 L218.1,250.0 L316.9,210.8 L415.6,187.0 L514.4,169.6 L613.1,189.1 L711.9,190.8 L810.6,118.6" pathLength="1" fill="none" stroke="#ee0000" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/><circle class="vtx" cx="119.4" cy="235.4" r="3" fill="#ee0000" style="animation-delay:1.20s"/><circle class="vtx" cx="218.1" cy="250.0" r="3" fill="#ee0000" style="animation-delay:1.32s"/><circle class="vtx" cx="316.9" cy="210.8" r="3" fill="#ee0000" style="animation-delay:1.44s"/><circle class="vtx" cx="415.6" cy="187.0" r="3" fill="#ee0000" style="animation-delay:1.56s"/><circle class="vtx" cx="514.4" cy="169.6" r="3" fill="#ee0000" style="animation-delay:1.68s"/><circle class="vtx" cx="613.1" cy="189.1" r="3" fill="#ee0000" style="animation-delay:1.80s"/><circle class="vtx" cx="711.9" cy="190.8" r="3" fill="#ee0000" style="animation-delay:1.92s"/><circle class="vtx" cx="810.6" cy="118.6" r="3" fill="#ee0000" style="animation-delay:2.04s"/><circle class="endping" cx="810.6" cy="118.6" r="5" fill="#ee0000"/>
