  <title id="t">Tiger Kaovilai</title>
  <desc id="d">Velero maintainer and OADP engineer at Red Hat. Live totals from my public PR history.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#cc0000"/><stop offset="1" stop-color="#ee0000"/>
    </linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#ee0000" stop-opacity=".35"/><stop offset="1" stop-color="#ee0000" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="900" height="250" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    
    .dot { animation: twinkle 4s ease-in-out infinite; }
    @keyframes twinkle { 0%,100% { transform: scale(1); } 50% { transform: scale(.6); opacity: .9; } }
    .dot { transform-box: fill-box; transform-origin: center; }
    .drift1 { animation: drift 18s ease-in-out infinite alternate; }
    .drift2 { animation: drift 24s ease-in-out infinite alternate-reverse; }
    @keyframes drift { from { transform: translate(0,0); } to { transform: translate(70px,24px); } }
    .phrase { opacity: 0; animation: swap 12s ease-in-out infinite; fill: #59636e; }
    @keyframes swap {
      0% { opacity: 0; transform: translateY(8px); }
      5%,28% { opacity: 1; transform: translateY(0); }
      33%,100% { opacity: 0; transform: translateY(-8px); }
    }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: .25; } }
    @media (prefers-reduced-motion: reduce) { .p0 { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }</style>
