<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" aria-labelledby="t d" role="img" viewBox="0 0 900 200"><title id="t">Open pull request pipeline</title><desc id="d">Stacked bar of my open PRs by status: ready, waiting to merge, CI, drafts and stale.</desc><defs><linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><linearGradient id="hot" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#c00"/><stop offset="1" stop-color="#e00"/></linearGradient><radialGradient id="aura"><stop offset="0" stop-color="#e00" stop-opacity=".35"/><stop offset="1" stop-color="#e00" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect width="900" height="200" rx="16"/></clipPath></defs><style>@keyframes beat{0%{opacity:1}50%{opacity:.55}}@keyframes alarm{0%{opacity:1}50%{opacity:.35}}text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:#59636e}.wipe{transform-box:fill-box;transform-origin:left;animation:wipe 1.4s cubic-bezier(.2,.8,.2,1) both}.seg-ready{animation:beat 2.6s ease-in-out 1.6s infinite}.seg-failing-ci{animation:alarm 1.2s ease-in-out 1.6s infinite}.sheen{animation:sweep 3.6s ease-in-out 1.8s infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="900" height="200" fill="url(#card)" rx="16"/><g clip-path="url(#clip)"><text x="32" y="38" font-size="18" font-weight="700">Open PR pipeline</text><text x="32" y="58" class="muted" font-size="12">175 open PRs in public org repos · 78 awaiting review · 40 approved and waiting to land</text><clipPath id="reveal"><rect width="836" height="30" x="32" y="78" class="wipe" rx="15"/></clipPath><rect width="836" height="30" x="32" y="78" fill="#e6eaef" rx="15"/><g clip-path="url(#reveal)"><rect width="262.7" height="30" x="32" y="78" fill="#3fb950" class="seg-ready"/><rect width="62.1" height="30" x="294.7" y="78" fill="#58a6ff" class="seg-waiting-merge"/><rect width="71.7" height="30" x="356.8" y="78" fill="#f85149" class="seg-failing-ci"/><rect width="28.7" height="30" x="428.5" y="78" fill="#db6d28" class="seg-needs-attention"/><rect width="14.3" height="30" x="457.2" y="78" fill="#a371f7" class="seg-hold"/><rect width="47.8" height="30" x="471.5" y="78" fill="#6e7681" class="seg-draft"/><rect width="348.7" height="30" x="519.3" y="78" fill="#484f58" class="seg-stale"/><rect width="160" height="30" x="-160" y="78" fill="url(#sheen)" class="sheen"/></g><linearGradient id="sheen"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><circle cx="37" cy="134" r="5" fill="#3fb950"/><text x="50" y="138" class="mono" font-size="13" font-weight="700">55</text><text x="74" y="138" class="muted" font-size="12">ready</text><circle cx="247" cy="134" r="5" fill="#58a6ff"/><text x="260" y="138" class="mono" font-size="13" font-weight="700">13</text><text x="284" y="138" class="muted" font-size="12">waiting to merge</text><circle cx="457" cy="134" r="5" fill="#d29922"/><text x="470" y="138" class="mono" font-size="13" font-weight="700">0</text><text x="486" y="138" class="muted" font-size="12">CI running</text><circle cx="667" cy="134" r="5" fill="#f85149"/><text x="680" y="138" class="mono" font-size="13" font-weight="700">15</text><text x="704" y="138" class="muted" font-size="12">failing CI</text><circle cx="37" cy="160" r="5" fill="#db6d28"/><text x="50" y="164" class="mono" font-size="13" font-weight="700">6</text><text x="66" y="164" class="muted" font-size="12">needs attention</text><circle cx="247" cy="160" r="5" fill="#a371f7"/><text x="260" y="164" class="mono" font-size="13" font-weight="700">3</text><text x="276" y="164" class="muted" font-size="12">on hold</text><circle cx="457" cy="160" r="5" fill="#6e7681"/><text x="470" y="164" class="mono" font-size="13" font-weight="700">10</text><text x="494" y="164" class="muted" font-size="12">draft</text><circle cx="667" cy="160" r="5" fill="#484f58"/><text x="680" y="164" class="mono" font-size="13" font-weight="700">73</text><text x="704" y="164" class="muted" font-size="12">stale</text></g><rect width="899" height="199" x=".5" y=".5" fill="none" stroke="#d0d7de" rx="16"/></svg>