<svg xmlns="http://www.w3.org/2000/svg" width="900" height="200" viewBox="0 0 900 200" role="img" aria-labelledby="t d">
  <title id="t">Open pull request pipeline</title>
  <desc id="d">Stacked bar of my open PRs by status: ready, waiting to merge, CI, drafts and stale.</desc>
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f6f8fa"/>
    </linearGradient>
    <linearGradient id="hot" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#cc0000"/><stop offset="1" stop-color="#ee0000"/>
    </linearGradient>
    <radialGradient id="aura"><stop offset="0" stop-color="#ee0000" stop-opacity=".35"/><stop offset="1" stop-color="#ee0000" stop-opacity="0"/></radialGradient>
    <clipPath id="clip"><rect width="900" height="200" rx="16"/></clipPath>
  </defs>
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .muted { fill: #59636e; }
    .roll { transform: translateY(var(--to)); animation: roll 1.4s cubic-bezier(.2,.8,.2,1) backwards; }
    @keyframes roll { from { transform: translateY(0); } }
    
    .wipe { transform-box: fill-box; transform-origin: left; animation: wipe 1.4s cubic-bezier(.2,.8,.2,1) both; }
    @keyframes wipe { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    .seg-ready { animation: beat 2.6s ease-in-out 1.6s infinite; }
    .seg-failing-ci { animation: alarm 1.2s ease-in-out 1.6s infinite; }
    .seg-ci-pending { animation: beat .9s ease-in-out 1.6s infinite; }
    @keyframes beat { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
    @keyframes alarm { 0%,100% { opacity: 1; } 50% { opacity: .35; } }
    .sheen { animation: sweep 3.6s ease-in-out 1.8s infinite; }
    @keyframes sweep { from { transform: translateX(0); } to { transform: translateX(1100px); } }
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; }
    }</style>
  <rect width="900" height="200" rx="16" fill="url(#card)"/>
  <g clip-path="url(#clip)">

    <text x="32" y="38" font-size="18" font-weight="700">Open PR pipeline</text>
    <text class="muted" x="32" y="58" font-size="12">187 open PRs in public org repos · 91 awaiting review · 44 approved and waiting to land</text>
    <clipPath id="reveal"><rect class="wipe" x="32" y="78" width="836" height="30" rx="15"/></clipPath>
    <rect x="32" y="78" width="836" height="30" rx="15" fill="#e6eaef"/>
    <g clip-path="url(#reveal)"><rect class="seg-ready" x="32.0" y="78" width="254.8" height="30" fill="#3fb950"/><rect class="seg-waiting-merge" x="286.8" y="78" width="62.6" height="30" fill="#58a6ff"/><rect class="seg-ci-pending" x="349.4" y="78" width="4.5" height="30" fill="#d29922"/><rect class="seg-failing-ci" x="353.9" y="78" width="53.6" height="30" fill="#f85149"/><rect class="seg-needs-attention" x="407.5" y="78" width="31.3" height="30" fill="#db6d28"/><rect class="seg-hold" x="438.8" y="78" width="17.9" height="30" fill="#a371f7"/><rect class="seg-draft" x="456.7" y="78" width="58.1" height="30" fill="#6e7681"/><rect class="seg-stale" x="514.8" y="78" width="353.2" height="30" fill="#484f58"/><rect class="sheen" x="-160" y="78" width="160" height="30" fill="url(#sheen)"/></g>
    <linearGradient id="sheen"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
    <circle cx="37" cy="134" r="5" fill="#3fb950"/><text class="mono" x="50" y="138" font-size="13" font-weight="700">57</text><text class="muted" x="74" y="138" font-size="12">ready</text><circle cx="247" cy="134" r="5" fill="#58a6ff"/><text class="mono" x="260" y="138" font-size="13" font-weight="700">14</text><text class="muted" x="284" y="138" font-size="12">waiting to merge</text><circle cx="457" cy="134" r="5" fill="#d29922"/><text class="mono" x="470" y="138" font-size="13" font-weight="700">1</text><text class="muted" x="486" y="138" font-size="12">CI running</text><circle cx="667" cy="134" r="5" fill="#f85149"/><text class="mono" x="680" y="138" font-size="13" font-weight="700">12</text><text class="muted" x="704" y="138" font-size="12">failing CI</text><circle cx="37" cy="160" r="5" fill="#db6d28"/><text class="mono" x="50" y="164" font-size="13" font-weight="700">7</text><text class="muted" x="66" y="164" font-size="12">needs attention</text><circle cx="247" cy="160" r="5" fill="#a371f7"/><text class="mono" x="260" y="164" font-size="13" font-weight="700">4</text><text class="muted" x="276" y="164" font-size="12">on hold</text><circle cx="457" cy="160" r="5" fill="#6e7681"/><text class="mono" x="470" y="164" font-size="13" font-weight="700">13</text><text class="muted" x="494" y="164" font-size="12">draft</text><circle cx="667" cy="160" r="5" fill="#484f58"/><text class="mono" x="680" y="164" font-size="13" font-weight="700">79</text><text class="muted" x="704" y="164" font-size="12">stale</text>
  </g>
  <rect x=".5" y=".5" width="899" height="199" rx="16" fill="none" stroke="#d0d7de"/>
</svg>
