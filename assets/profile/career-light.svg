<svg xmlns="http://www.w3.org/2000/svg" width="900" height="654" aria-labelledby="cm-desktop-title cm-desktop-desc" class="career-viz" role="img" viewBox="0 0 900 654"><title id="cm-desktop-title">Tiger Kaovilai · career map</title><desc id="cm-desktop-desc">Career connections from Bangkok, Thailand, through Invercargill, New Zealand, to Raleigh, North Carolina. NC State Industrial Engineering and Computer Science; Red Hat Senior Software Engineer working on OADP; Red Hat Technical Marketing and Deutsche Bank dbAchieve internships; Velero maintainer and community mentor. Personal projects use Flutter/Dart, Vue/NextJS, GitHub Actions and CircleCI. Education dates are documented; employment dates are unspecified. Lines show connections, not measured time or geographic distance.</desc><style>@keyframes cm-beacon{50%{opacity:.15;r:15}}.career-viz{--cm-bg:#ffffff;--cm-panel:#f6f8fa;--cm-ink:#1f2328;--cm-muted:#59636e;--cm-line:#d0d7de;--cm-edu:#2a78d6;--cm-work:#eb6834;--cm-oss:#1baf7a;font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,sans-serif}.career-viz text{fill:var(--cm-ink)}.career-viz .cm-muted{fill:var(--cm-muted)}.cm-bg,.cm-card{fill:var(--cm-bg);stroke:var(--cm-line)}.cm-card{fill:var(--cm-panel);stroke-width:1}.edu{fill:var(--cm-edu)}.work{fill:var(--cm-work)}.oss{fill:var(--cm-oss)}.cm-link,.cm-route{fill:none;stroke:var(--cm-line)}.cm-route{stroke-width:2}.cm-link{stroke-width:1}.cm-beacon,.cm-flow{fill:none;stroke-width:2}.cm-flow{stroke:var(--cm-edu);stroke-dasharray:12 282;animation:cm-flow 4s linear 1}.cm-beacon{stroke:var(--cm-oss);opacity:.5;animation:cm-beacon 4s ease-in-out 1}.cm-node:focus .cm-card,.cm-node:hover .cm-card{stroke:var(--cm-ink)}@media (prefers-reduced-motion:reduce){.career-viz *{animation:none!important}}@media (forced-colors:active){.career-viz text,.cm-mark{fill:CanvasText}.cm-bg,.cm-card{fill:Canvas;stroke:CanvasText}}</style><rect width="899" height="653" x=".5" y=".5" class="cm-bg" rx="16"/><text x="28" y="36" font-size=