    <g class="walker"><g transform="translate(0,186) scale(1.15)">
    <g class="body-bob">
      <g transform="translate(-30,-33)"><g class="leg" style="animation-delay:-0.35s"><rect x="-4.5" y="0" width="9" height="31" rx="4.5" fill="#6c5c4b"/><rect x="-4.5" y="9" width="9" height="3.2" fill="#2a2420" opacity=".75"/><rect x="-4.5" y="16" width="9" height="3.2" fill="#2a2420" opacity=".75"/><ellipse cx="1" cy="30.5" rx="7" ry="4" fill="#6c5c4b"/></g></g><g transform="translate(20,-33)"><g class="leg" style="animation-delay:0s"><rect x="-4.5" y="0" width="9" height="31" rx="4.5" fill="#6c5c4b"/><rect x="-4.5" y="9" width="9" height="3.2" fill="#2a2420" opacity=".75"/><rect x="-4.5" y="16" width="9" height="3.2" fill="#2a2420" opacity=".75"/><ellipse cx="1" cy="30.5" rx="7" ry="4" fill="#6c5c4b"/></g></g>
      <g class="tail" transform="translate(-40,-50)"><g class="tail-sway">
        <path d="M0,0 C-22,-4 -36,-24 -31,-52" fill="none" stroke="#8c7a64" stroke-width="8" stroke-linecap="round"/>
        <path d="M0,0 C-22,-4 -36,-24 -31,-52" fill="none" stroke="#2a2420" stroke-width="8.2" stroke-dasharray="5 6" opacity=".85"/>
      </g></g>
      <ellipse cx="0" cy="-44" rx="45" ry="21" fill="#8c7a64"/>
      <ellipse cx="3" cy="-31" rx="34" ry="8.5" fill="#e0cdb0" opacity=".55"/>
      <path d="M-40,-59 Q0,-72 36,-59" fill="none" stroke="#2a2420" stroke-width="5" stroke-linecap="round" opacity=".6"/>
      <path d="M-26,-63 q4,10 -2,22" fill="none" stroke="#2a2420" stroke-width="3.6" stroke-linecap="round" opacity=".85"/><path d="M-12,-65 q4,12 -1,24" fill="none" stroke="#2a2420" stroke-width="3.6" stroke-linecap="round" opacity=".85"/><path d="M2,-65 q4,12 0,24" fill="none" stroke="#2a2420" stroke-width="3.6" stroke-linecap="round" opacity=".85"/><path d="M16,-62 q3,10 0,20" fill="none" stroke="#2a2420" stroke-width="3.6" stroke-linecap="round" opacity=".85"/>
      <g transform="translate(-22,-33)"><g class="leg" style="animation-delay:0s"><rect x="-4.5" y="0" width="9" height="31" rx="4.5" fill="#8c7a64"/><rect x="-4.5" y="9" width="9" height="3.2" fill="#2a2420" opacity=".75"/><rect x="-4.5" y="16" width="9" height="3.2" fill="#2a2420" opacity=".75"/><ellipse cx="1" cy="30.5" rx="7" ry="4" fill="#e0cdb0"/></g></g><g transform="translate(28,-33)"><g class="leg" style="animation-delay:-0.35s"><rect x="-4.5" y="0" width="9" height="31" rx="4.5" fill="#8c7a64"/><rect x="-4.5" y="9" width="9" height="3.2" fill="#2a2420" opacity=".75"/><rect x="-4.5" y="16" width="9" height="3.2" fill="#2a2420" opacity=".75"/><ellipse cx="1" cy="30.5" rx="7" ry="4" fill="#e0cdb0"/></g></g>
      <ellipse cx="40" cy="-42" rx="13" ry="15" fill="#e0cdb0"/>
      <g class="head-bob">
        <g class="ear ear-l"><polygon points="31,-75 29,-107 48,-83" fill="#8c7a64"/><polygon points="33,-79 32,-99 43,-84" fill="#d79a94"/></g>
        <g class="ear ear-r"><polygon points="52,-83 73,-107 71,-74" fill="#8c7a64"/><polygon points="56,-84 71,-99 69,-80" fill="#d79a94"/></g>
        <ellipse cx="50" cy="-62" rx="24.5" ry="20.5" fill="#8c7a64"/>
        <path d="M44,-81 l2,9 M50,-83 v10 M56,-81 l-2,9 M26,-65 q6,2 9,0 M74,-65 q-6,2 -9,0" fill="none" stroke="#2a2420" stroke-width="2.6" stroke-linecap="round" opacity=".9"/>
        <ellipse cx="50" cy="-53" rx="12.5" ry="8.5" fill="#e0cdb0"/>
        <g class="eye" transform="translate(40,-65)"><g class="blink"><ellipse rx="5.6" ry="6" fill="#b89b3e"/><ellipse rx="1.7" ry="4.9" fill="#14100d"/><circle cx="-1.8" cy="-2.2" r="1.3" fill="#fff" opacity=".9"/></g></g><g class="eye" transform="translate(60,-65)"><g class="blink"><ellipse rx="5.6" ry="6" fill="#b89b3e"/><ellipse rx="1.7" ry="4.9" fill="#14100d"/><circle cx="-1.8" cy="-2.2" r="1.3" fill="#fff" opacity=".9"/></g></g>
        <path d="M46.5,-58.5 h7 l-3.5,4.5 z" fill="#c98a80"/>
        <path d="M50,-54 v2 M50,-52 q-3,3 -6,1 M50,-52 q3,3 6,1" fill="none" stroke="#2a2420" stroke-width="1" stroke-linecap="round" opacity=".7"/>
        <line x1="41" y1="-54" x2="14" y2="-59" stroke="#cdbfa9" stroke-width="1" stroke-linecap="round" opacity=".9"/><line x1="41" y1="-52" x2="13" y2="-52" stroke="#cdbfa9" stroke-width="1" stroke-linecap="round" opacity=".9"/><line x1="42" y1="-50" x2="16" y2="-45" stroke="#cdbfa9" stroke-width="1" stroke-linecap="round" opacity=".9"/><line x1="59" y1="-54" x2="86" y2="-59" stroke="#cdbfa9" stroke-width="1" stroke-linecap="round" opacity=".9"/><line x1="59" y1="-52" x2="87" y2="-52" stroke="#cdbfa9" stroke-width="1" stroke-linecap="round" opacity=".9"/><line x1="58" y1="-50" x2="84" y2="-45" stroke="#cdbfa9" stroke-width="1" stroke-linecap="round" opacity=".9"/>
