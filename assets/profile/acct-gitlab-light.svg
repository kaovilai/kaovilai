<svg xmlns="http://www.w3.org/2000/svg" width="210" height="52" aria-labelledby="t d" role="img" viewBox="0 0 210 52"><title id="t">GitLab (kaovilai)</title><desc id="d">Link to my GitLab profile.</desc><defs><linearGradient id="card" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#f6f8fa"/></linearGradient><linearGradient id="hot" x1="0" x2="0" y1="1" y2="0"><stop offset="0" stop-color="#c00"/><stop offset="1" stop-color="#e00"/></linearGradient><radialGradient id="aura"><stop offset="0" stop-color="#e00" stop-opacity=".35"/><stop offset="1" stop-color="#e00" stop-opacity="0"/></radialGradient><clipPath id="clip"><rect width="210" height="52" rx="14"/></clipPath></defs><style>@keyframes breathe{0%{transform:scale(1)}50%{transform:scale(1.08)}}@keyframes sweep{0%{transform:translateX(0)}40%{transform:translateX(310px)}}text{font-family:-apple-system,&apos;Segoe UI&apos;,Helvetica,Arial,sans-serif;fill:#1f2328}.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.muted{fill:#59636e}.enter{animation:rise .6s cubic-bezier(.2,.8,.2,1) backwards}.edge{stroke-dasharray:1000;animation:trace 1.4s ease-out backwards}.badge{transform-box:fill-box;transform-origin:center;animation:breathe 3.6s ease-in-out infinite}.gleam{animation:sweep 5s ease-in-out infinite}@media (prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="210" height="52" fill="url(#card)" rx="14"/><g clip-path="url(#clip)"><clipPath id="pill"><rect width="210" height="52" rx="14"/></clipPath><linearGradient id="gleam" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".22"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient><g style="animation-delay:.12s" class="enter"><rect width="208" height="50" x="1" y="1" fill="none" stroke="#fc6d26" stroke-width="1.5" class="edge" opacity=".55" rx="13"/><g style="animation-delay:.72s" class="badge"><rect width="32" height="32" x="12" y="10" fill="#fc6d26" rx="9"/><text style="fill:#fff" x="28" y="31" class="mono" font-size="13" font-weight="800" text-anchor="middle">GL</text></g><text x="56" y="25" font-size="14" font-weight="700">GitLab</text><text x="56" y="40" class="mono muted" font-size="10.5">kaovilai</text><g clip-path="url(#pill)"><rect style="animation-delay:1.62s" width="80" height="52" x="-80" y="0" fill="url(#gleam)" class="gleam"/></g></g></g><rect width="209" height="51" x=".5" y=".5" fill="none" stroke="#d0d7de" rx="14"/></svg>