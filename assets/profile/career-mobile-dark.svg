<svg xmlns="http://www.w3.org/2000/svg" class="career-viz" width="480" height="1450" viewBox="0 0 480 1450" role="img" aria-labelledby="cm-mobile-title cm-mobile-desc"><title id="cm-mobile-title">Tiger Kaovilai · career map</title><desc id="cm-mobile-desc">Career connections from Bangkok, Thailand, through Invercargill, New Zealand, to Raleigh, North Carolina. NC State Industrial Engineering and Computer Science; Red Hat Senior Software Engineer working on OADP; Red Hat Technical Marketing and Deutsche Bank dbAchieve internships; Velero maintainer and community mentor. Personal projects use Flutter/Dart, Vue/NextJS, GitHub Actions and CircleCI. Education dates are documented; employment dates are unspecified. Lines show connections, not measured time or geographic distance.</desc><style>
      .career-viz {--cm-bg:#0d1117;--cm-panel:#161b22;--cm-ink:#e6edf3;--cm-muted:#8b949e;--cm-line:#30363d;--cm-edu:#3987e5;--cm-work:#d95926;--cm-oss:#199e70;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;}
      .career-viz text {fill:var(--cm-ink);}
      .career-viz .cm-muted {fill:var(--cm-muted);}
      .cm-bg {fill:var(--cm-bg);stroke:var(--cm-line);}
      .cm-card {fill:var(--cm-panel);stroke:var(--cm-line);stroke-width:1;}
      .edu {fill:var(--cm-edu);} .work {fill:var(--cm-work);} .oss {fill:var(--cm-oss);}
      .cm-route {fill:none;stroke:var(--cm-line);stroke-width:2;}
      .cm-link {fill:none;stroke:var(--cm-line);stroke-width:1;}
      .cm-flow {fill:none;stroke:var(--cm-edu);stroke-width:2;stroke-dasharray:12 282;animation:cm-flow 4s linear 1;}
      @keyframes cm-flow {to {stroke-dashoffset:-294;}}
      .cm-beacon {fill:none;stroke:var(--cm-oss);stroke-width:2;opacity:.5;animation:cm-beacon 4s ease-in-out 1;}
      @keyframes cm-beacon {50% {opacity:.15;r:15;}}
      .cm-node:hover .cm-card,.cm-node:focus .cm-card {stroke:var(--cm-ink);}
      @media(prefers-reduced-motion:reduce) {.career-viz * {animation:none!important;}}
      @media(forced-colors:active) {.cm-mark {fill:CanvasText;} .cm-card,.cm-bg {fill:Canvas;stroke:CanvasText;} .career-viz text {fill:CanvasText;}}
