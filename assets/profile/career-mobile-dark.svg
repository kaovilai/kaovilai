<svg xmlns="http://www.w3.org/2000/svg" width="480" height="1450" aria-labelledby="cm-mobile-title cm-mobile-desc" class="career-viz" role="img" viewBox="0 0 480 1450"><title id="cm-mobile-title">Tiger Kaovilai · career map</title><desc id="cm-mobile-desc">Career connections from Bangkok, Thailand, through Invercargill, New Zealand, to Raleigh, North Carolina. NC State Industrial Engineering and Computer Science; Red Hat Senior Software Engineer working on OADP; Red Hat Technical Marketing and Deutsche Bank dbAchieve internships; Velero maintainer and community mentor. Personal projects use Flutter/Dart, Vue/NextJS, GitHub Actions and CircleCI. Education dates are documented; employment dates are unspecified. Lines show connections, not measured time or geographic distance.</desc><style>@keyframes cm-beacon{50%{opacity:.15;r:15}}.career-viz{--cm-bg:#0d1117;--cm-panel:#161b22;--cm-ink:#e6edf3;--cm-muted:#8b949e;--cm-line:#30363d;--cm-edu:#3987e5;--cm-work:#d95926;--cm-oss:#199e70;font-family:system-ui,-apple-system,&apos;Segoe UI&apos;,sans-serif}.career-viz text{fill:var(--cm-ink)}.career-viz .cm-muted{fill:var(--cm-muted)}.cm-bg,.cm-card{fill:var(--cm-bg);stroke:var(--cm-line)}.cm-card{fill:var(--cm-panel);stroke-width:1}.edu{fill:var(--cm-edu)}.work{fill:var(--cm-work)}.oss{fill:var(--cm-oss)}.cm-route{stroke:var(--cm-line)}.cm-beacon,.cm-flow,.cm-route{fill:none;stroke-width:2}.cm-flow{stroke:var(--cm-edu);stroke-dasharray:12 282;animation:cm-flow 4s linear 1}.cm-beacon{stroke:var(--cm-oss);opacity:.5;animation:cm-beacon 4s ease-in-out 1}.cm-node:focus .cm-card,.cm-node:hover .cm-card{stroke:var(--cm-ink)}@media (prefers-reduced-motion:reduce){.career-viz *{animation:none!important}}@media (forced-colors:active){.career-viz text,.cm-mark{fill:CanvasText}.cm-bg,.cm-card{fill:Canvas;stroke:CanvasText}}</style><rect width="479" height="1449" x=".5" y=".5" class="cm-bg" rx="16"/><text x="28" y="36" font-size="23" font-weight="650">Career map</text><text x="28" y="72"