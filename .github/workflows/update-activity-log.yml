name: Update Activity Log

on:
  schedule:
    # Keep in sync with update-pr-badges.yml so activity.json and .md files update together
    # Run every hour during weekday active hours (Mon-Fri, 7am-6pm EST = 12:00-22:00 UTC)
    - cron: '0 12-22 * * 1-5'
    # Run every 6 hours on weekends (less frequent)
    - cron: '0 */6 * * 0,6'
    # Run less frequently during weekday off-hours (after 6pm EST = 23:00 UTC, and before 7am EST = 12:00 UTC)
    - cron: '0 0,6,23 * * 1-5'
  workflow_dispatch: # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - '.github/workflows/update-activity-log.yml'
      - '.github/scripts/update-activity-log.sh'

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  update-activity-log:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6

      - name: Generate activity log
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bash .github/scripts/update-activity-log.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add MY_ACTIVITY.md activity.json
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update activity log for past two weeks"
            git push
          fi
