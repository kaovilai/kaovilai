name: Profile SVG tests

on:
  pull_request:
    paths:
      - '.github/workflows/profile-svg-tests.yml'
      - '.github/scripts/generate-profile-svgs.py'
      - '.github/scripts/career_map.py'
      - '.github/scripts/test_career_map.py'
      - '.github/scripts/test_bojangles.py'
      - '.github/artwork/**'
      - 'career-map.json'
      - 'career/index.html'
      - 'assets/profile/**'
      - 'README.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-svg-tests.yml'
      - '.github/scripts/generate-profile-svgs.py'
      - '.github/scripts/career_map.py'
      - '.github/scripts/test_career_map.py'
      - '.github/scripts/test_bojangles.py'
      - '.github/artwork/**'
      - 'career-map.json'
      - 'career/index.html'
      - 'assets/profile/**'
      - 'README.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Validate career and Bojangles SVGs
        run: |
          python3 -I -B .github/scripts/test_career_map.py
          python3 -I -B .github/scripts/test_bojangles.py
